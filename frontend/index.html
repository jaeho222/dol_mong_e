 cx="205.2" cy="905.0" r="13.5" fill="#8aa876"/><circle cx="172.2" cy="897.6" r="18.0" fill="#6f8f5c"/><circle cx="141.9" cy="896.8" r="18.0" fill="#8aa876"/><circle cx="150.9" cy="895.0" r="20.4" fill="#8aa876"/><circle cx="124.8" cy="883.2" r="17.2" fill="#a9c08f"/><circle cx="150.2" cy="872.2" r="17.0" fill="#a9c08f"/><circle cx="152.1" cy="861.6" r="20.6" fill="#a9c08f"/></svg><!--/LOGO--><span class="logo-sub">숨 고를 한 달</span></a>

        <button class="pill-btn" data-open-agent>물어보기</button>
        <button class="icon-btn" id="theme-toggle" aria-label="테마 전환"><svg class="ico"><use href="#i-moon"/></svg></button>
        <button class="icon-btn" data-open-agent aria-label="검색"><svg class="ico"><use href="#i-search"/></svg></button>
      </div>

  </header>

  <main>
    <!-- ③ 배너 캐러셀 -->
    <section class="carousel-wrap">
      <div class="carousel" id="carousel"></div>
      <div class="dots" id="dots"></div>
    </section>

    <!-- ④ 권역 탭 -->
    <nav class="tabs" id="tabs">
      <div class="wrap tabs-in">
        <button class="tab active" data-zone="">전체</button>
        <button class="tab" data-zone="제주시권">제주시</button>
        <button class="tab" data-zone="서부">서부</button>
        <button class="tab" data-zone="동부">동부</button>
        <button class="tab" data-zone="서귀포권">서귀포</button>
        <button class="tab" data-zone="남서부">남서부</button>
      </div>
    </nav>

    <!-- ⑤ 조건 바: 바꾸면 바로 다시 계산 -->
    <section class="wrap conditions" id="conditions">
      <label class="cond"><span>출발</span><input type="month" id="c-month" /></label>
      <label class="cond"><span>기간</span>
        <select id="c-days">
          <option value="14">2주</option><option value="30" selected>한 달</option><option value="60">두 달</option>
          <option value="90">석 달</option><option value="180">반년</option><option value="365">1년</option>
        </select></label>
      <label class="cond"><span>인원</span>
        <select id="c-people"><option value="1">1명</option><option value="2" selected>2명</option><option value="3">3명</option><option value="4">4명</option></select></label>
      <label class="cond"><span>이동</span>
        <select id="c-car"><option value="true">렌터카</option><option value="false">버스</option></select></label>
      <label class="cond"><span>예산</span><input type="number" id="c-budget" placeholder="제한 없음" min="0" step="50" /><em>만원</em></label>
      <button class="toggle" data-toggle="with_kids">아이와 함께</button>
      <button class="toggle" data-toggle="remote_work">원격근무</button>
      <button class="toggle" data-toggle="prefer_quiet">한적한 곳</button>
    </section>

    <!-- ⑥ 결과 -->
    <section class="wrap results">
      <div class="results-head">
        <h3 id="results-title">이번 조건으로 본 동네</h3>
        <span class="muted" id="data-note"></span>
      </div>
      <div class="grid" id="grid"></div>
      <p class="muted foot-note">금액은 공개 데이터와 시장 조사로 낸 추정치예요. 실제 계약가와 다를 수 있어요.
        · 데이터: 제주데이터허브, 공공데이터포털</p>
    </section>
  </main>

  <!-- ⑦ Agent 시트 -->
  <div class="sheet-backdrop" id="sheet-backdrop"></div>
  <aside class="sheet" id="sheet" aria-hidden="true">
    <div class="sheet-head">
      <div><b>말로 물어보기</b><span class="muted" id="mode-label"></span></div>
      <button class="icon-btn" id="sheet-close" aria-label="닫기"><svg class="ico"><use href="#i-x"/></svg></button>
    </div>
    <div class="examples" id="examples"></div>
    <div class="msgs" id="msgs">
      <div class="msg bot">언제, 얼마나, 누구와 오는지, 차는 빌릴지 편하게 적어 주세요. 동네별로 얼마 드는지 계산해 볼게요.</div>
    </div>
    <form class="ask" id="ask">
      <input id="ask-text" autocomplete="off" placeholder="예) 1월부터 석 달, 둘이서, 차 없이" />
      <button class="send" aria-label="보내기"><svg class="ico"><use href="#i-send"/></svg></button>
    </form>
  </aside>

  <!-- ⑧ 하단 내비 -->
  <nav class="bottom-nav">
    <a class="active" href="#"><svg class="ico"><use href="#i-compass"/></svg><span>둘러보기</span></a>
    <a href="#conditions"><svg class="ico"><use href="#i-sliders"/></svg><span>조건</span></a>
    <a href="#" data-open-agent><svg class="ico"><use href="#i-message"/></svg><span>물어보기</span></a>
    <a href="#" id="nav-support" target="_blank" rel="noopener"><svg class="ico"><use href="#i-flag"/></svg><span>지원사업</span></a>
    <a href="#" class="disabled" title="준비 중"><svg class="ico"><use href="#i-map"/></svg><span>지도</span></a>
  </nav>

  <script src="assets/app.js"></script>
</body>
</html>
